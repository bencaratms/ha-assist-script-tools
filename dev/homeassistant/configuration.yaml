default_config:

homeassistant:
  name: Assist Script Tools Development

script:
  verify_target_resolution:
    alias: Verify target resolution
    description: Verify a selected speaker without playing media.
    fields:
      media_player_entity_id:
        name: Target speaker
        description: Canonical media player entity ID to verify.
        required: true
        selector:
          entity:
            domain: media_player
    sequence:
      - stop: Target received.
