default_config:

homeassistant:
  name: Assist Script Tools Development

input_boolean:
  kitchen_speaker:
    name: Kitchen Speaker
    icon: mdi:speaker

script:
  verify_target_resolution:
    alias: Verify target resolution
    description: Verify a selected target without controlling it.
    fields:
      target_entity_id:
        name: Target entity
        description: Canonical entity ID to verify.
        required: true
        selector:
          entity:
            domain: input_boolean
    sequence:
      - stop: Target received.

  verify_music_assistant_target_resolution:
    alias: Verify Music Assistant target resolution
    description: Verify a Music Assistant media-player target without controlling it.
    fields:
      media_player_entity_id:
        name: Media Player
        description: Music Assistant media-player entity to verify.
        required: true
        selector:
          entity:
            filter:
              - domain: media_player
                integration: music_assistant
    sequence:
      - stop: Music Assistant target received.
