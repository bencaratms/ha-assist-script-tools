[project]
name = "ha-assist-script-tools"
version = "0.1.0"
description = "Home Assistant Assist/LLM tools that safely invoke scripts with human-friendly entity resolution."
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "MIT" }

[dependency-groups]
dev = [
  "homeassistant==2026.9.4",
  "pytest-homeassistant-custom-component==0.13.367",
  "ruff==0.14.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]
